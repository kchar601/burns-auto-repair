<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>burns-auto-repair</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Rambla:wght@700&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Rambla:wght@700&display=swap"
      />
    </noscript>
    <link
      rel="preload"
      as="image"
      href="./src/assets/shopzoomed.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <script
      src="https://kit.fontawesome.com/3c0c33681c.js"
      crossorigin="anonymous"
      defer
    ></script>
    <link
      rel="icon"
      type="image/png"
      href="/Burns favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/Burns favicon light.png"
      media="(prefers-color-scheme: dark)"
    />
  </head>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
